version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One boring PR a week instead of one per package. Majors are ignored
      # below, so this group is the whole of the scheduled stream.
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # ---- Scheduled updates are minor + patch only ------------------------
      # An auto-PR should be something that can be read and merged in a minute.
      # A major bump is a migration, not a chore, so majors are taken
      # deliberately and never on a weekly timer.
      #
      # This costs nothing in security, which is the load-bearing detail here.
      # From GitHub's docs: "There is no interaction between the settings
      # specified in the dependabot.yml file and Dependabot security alerts."
      # `ignore` suppresses only *scheduled version updates*. Dependabot
      # *security* updates bypass this file entirely, so when the only fix for
      # an advisory is a major bump, that PR still arrives - on its own and
      # unbatched, which is exactly how a security fix should show up.
      # Dependabot alerts + security updates are enabled on this repo, and that
      # is what makes the above true. Do not delete this rule to "unblock" a
      # security fix: it has never blocked one.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Deliberately ungrouped: there is one base image, and its digest refreshes
    # are the security rebuilds - they should arrive as their own obvious PR
    # rather than folded into a batch.
    ignore:
      # Same floor as pip above: majors are deliberate, and security updates
      # bypass this file, so an advisory-driven major still opens its own PR.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # This app runs on the CPython 3.12 line and `python:3.12-slim` is a
      # floating tag, so security-patched CPython/Debian rebuilds already arrive
      # on every image build with no PR needed. All Dependabot could propose is
      # the next feature release (3.13/3.14) - an interpreter migration to be
      # decided and tested deliberately, not taken automatically.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
